<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>built — paid key confirmation in the real popover</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body,#root{height:600px}
  body{background:#cdd5e2;margin:0;display:flex;gap:26px;align-items:flex-start;
       padding:26px;font-family:var(--sans)}
  #shell{width:376px;height:600px;border-radius:16px;overflow:hidden;
         box-shadow:0 14px 40px rgba(12,18,30,.22);flex:none}
  #panel{font-size:12.5px;color:#26303f;max-width:280px}
  #panel h2{font-family:"Outfit",sans-serif;font-size:14px;margin:0 0 10px}
  #panel button{display:block;width:100%;text-align:left;font:inherit;font-size:12.5px;
    margin-bottom:7px;padding:9px 11px;border-radius:10px;border:1px solid rgba(12,18,30,.14);
    background:#fff;cursor:pointer}
  #panel button:hover{background:#f2f5fa}
  #panel .on{background:#161b24;color:#fff;border-color:#161b24}
  #panel p{margin:14px 0 0;line-height:1.5;color:#4b5666}
</style>
</head>
<body>
  <div id="shell"><div id="root"></div></div>
  <div id="panel">
    <h2>cases</h2>
    <div id="btns"></div>
    <p>The real <code>bundle.js</code>, the real popover width (376&times;600). Click a case to
      re-render. Theme switches with the app's own setting.</p>
  </div>

<script src="bundle.js"></script>
<script>
const iso = (m) => new Date(Date.now() + m*60000).toISOString();
const price = (i, o) => ({ source:"live", currency:"USD", token_unit:"per_million_tokens",
  estimate:true, verified_at:new Date().toISOString(),
  rates:{ input:{status:i==null?"unknown":"known", value:i},
          output:{status:o==null?"unknown":"known", value:o} } });

const base = (theme) => ({
  settings:{ theme, auto_switch:true, strategy:"soonest_back",
             confirm_key_switch:true, key_fallback:true, notify:true },
  counts:{ resting:1, ready:1 }, dot:"amber", door:"open",
  app:{ version:"1.0.1", build:"dev" },
  supervision:{ block:true, path:true, wrappers:true },
  tools:{
    codex:{ active:"work@studio.dev", plan_label:"CHATGPT BUSINESS", seats:[
      { email:"work@studio.dev", name:"Work", plan:"Business", status:"resting", active:true,
        limited:true, limited_until:iso(138), usage5h:100, usageWeek:84 } ]},
    claude:{ active:"studio@studio.dev", plan_label:"CLAUDE CODE", seats:[
      { email:"studio@studio.dev", name:"Studio", plan:"Max", status:"active", active:true,
        limited:false, usage5h:6, usageWeek:72 } ]},
  },
  keys:[ { id:"k1", label:"after hours", provider:"openrouter", harness:"codex",
           model:"anthropic/claude-sonnet-4.6", responses_verified:true,
           last_validation:{ operation_permitted:true } } ],
  rev: 1,
});

const req = (over={}) => ({ id:"p1", status:"pending", tool:"codex", expires_at:iso(4), notify:true,
  from_seat:{ id:"work@studio.dev", label:"Work" },
  key_seat:{ id:"k1", label:"after hours", provider:"openrouter",
             model:"anthropic/claude-sonnet-4.6" },
  price: price("3","15"), ...over });

const cases = {
  "codex · priced": () => ({ ...base("light"), pending_key_switches:[ req() ] }),
  "claude · coral primary": () => ({ ...base("light"),
    pending_key_switches:[ req({ tool:"claude",
      key_seat:{ id:"k2", label:"eu fallback", provider:"anthropic", model:"claude-opus-5" },
      price: price("15","75") }) ] }),
  "price unavailable": () => ({ ...base("light"),
    pending_key_switches:[ req({ price: price(null,null) }) ] }),
  "cheap model": () => ({ ...base("light"),
    pending_key_switches:[ req({ price: price("0.075","0.3") }) ] }),
  "no reset time known": () => {
    const s = base("light");
    s.tools.codex.seats[0].limited_until = null;
    return { ...s, pending_key_switches:[ req() ] };
  },
  "dark theme": () => ({ ...base("dark"), pending_key_switches:[ req() ] }),
};

const btns = document.getElementById("btns");
let active = null;
Object.keys(cases).forEach((name) => {
  const b = document.createElement("button");
  b.textContent = name;
  b.onclick = () => {
    if (active) active.classList.remove("on");
    b.classList.add("on"); active = b;
    window.AGL.result({ ok:true, state: cases[name]() });
  };
  btns.appendChild(b);
});
btns.firstChild.click();
</script>
</body>
</html>
