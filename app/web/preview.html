<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ai guest list — preview</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:var(--desk,#cdd5e2);padding:30px;display:flex;justify-content:center}
    #root{width:376px;max-width:100%;flex:none}
    @media(max-width:436px){body{padding:0}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="bundle.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const iso = (m) => new Date(Date.now() + m * 60000).toISOString();
    const usage = (p5, m5, pWeek) => ({
      ok: true,
      error: null,
      error_streak: 0,
      fetched_at: iso(0),
      limit_reached: null,
      windows: {
        "5h": { used_pct: p5, resets_at: iso(m5) },
        "weekly": { used_pct: pWeek, resets_at: iso(3 * 1440) },
      },
    });
    const seat = (email, name, plan, kind, status, active, p5, m5, pWeek, limitedUntil = null) => ({
      email,
      name,
      custom_name: name,
      plan,
      kind,
      status,
      active,
      limited: Boolean(limitedUntil),
      limited_until: limitedUntil,
      needs_login: false,
      entitlement_revoked: false,
      signed_out: false,
      signin_expires_at: null,
      signin_expiring: false,
      in_session: false,
      session_started_at: null,
      usage_fetched_at: iso(0),
      usage_stale: false,
      usage_age_s: 0,
      usage_unknown: false,
      usage5h: p5,
      usageWeek: pWeek,
      usage: usage(p5, m5, pWeek),
      added_at: iso(-1440),
      last_on_floor: active ? iso(-120) : null,
      account_id: `acct:${email}`,
      workspace_id: null,
      shared_account: false,
      shared_account_with: [],
      shared_workspace_with: [],
    });
    window.AGL.result({ state: {
      settings: {
        theme: params.get("theme") === "dark" ? "dark" : "light",
        auto_switch: true,
        notify: true,
        restart_app: false,
        supervise_shell: true,
        confirm_key_switch: true,
        key_fallback: false,
        in_place_switch: true,
        keep_warm: true,
        crossing_auto: false,
        in_place_cross_tier: true,
        engine_restart: true,
      },
      counts: { resting: 1, ready: 3 },
      warnings: [],
      door: "open",
      app: { version: "1.10.0", build: "dev" },
      update: null,
      supervision: { wrappers: true, block: true, on_path: true, active: true },
      codex_live_unregistered: null,
      tools: {
        codex: {
          active: "personal@studio.example",
          plan_label: "CHATGPT BUSINESS",
          seats: [
            seat("personal@studio.example", "Personal", "Business", "business", "active", true, 38, 180, 21),
            seat("work@studio.example", "Work", "Business", "business", "resting", false, 100, 101, 74, iso(101)),
          ],
          selection: { email: "personal@studio.example", available: true, all_limited: false, unlocks_at: null },
        },
        claude: {
          active: "studio@studio.example",
          plan_label: "CLAUDE CODE",
          seats: [
            seat("studio@studio.example", "Studio", "Max", "personal", "active", true, 20, 240, 16),
            seat("personal@me.example", "Personal", "Pro", "personal", "ready", false, 5, 300, 4),
          ],
          selection: { email: "studio@studio.example", available: true, all_limited: false, unlocks_at: null },
        },
      },
      keys: [
        {
          id: "sample-openai-key",
          label: "Late-night",
          provider: "openai",
          harness: "codex",
          model: "gpt-5.4",
          fingerprint: "demo",
          responses_verified: true,
          created_at: iso(-1440),
        },
      ],
      running_key_seats: [],
      pinned_sessions: [],
      engine_warnings: [],
      pending_key_switches: [],
      pending_crossings: [],
      pending_tier_requests: [],
      rev: 1,
    }});
    // Examples: ?screen=usage&theme=dark, &mode=month, &open=claude:biz@example.com&scroll=seat
    // Fixture-only history also exercises the shipping action/reply path, without a native bridge.
    async function previewUsage() {
      if (params.get("screen") !== "usage") return;
      document.querySelector('[data-action="usage"]').click();
      if (params.get("status") !== "loading") {
        const fixture = params.get("status") === "indexing" ? "usage-history.indexing.json" : "usage-history.sample.json";
        const payload = await (await fetch(`fixtures/${fixture}`)).json();
        if (params.get("status") === "empty") {
          for (const periods of Object.values(payload.calendar)) for (const period of periods) period.by = {};
        }
        window.AGL.result(params.get("status") === "error"
          ? { ok: false, usage_history_error: "couldn't read a local log — try again" }
          : { ok: true, usage_history: payload });
      }
      if (params.get("mode") === "month") document.querySelector('[data-action="usage-mode"][data-value="month"]').click();
      if (params.get("basis")) document.querySelector(`[data-action="usage-basis"][data-value="${CSS.escape(params.get("basis"))}"]`)?.click();
      const key = params.get("open");
      const row = key && [...document.querySelectorAll('[data-action="usage-seat"]')].find((el) => el.dataset.key === key);
      row?.click();
      await document.fonts.ready;
      if (key && params.get("scroll") === "seat") {
        const currentRow = [...document.querySelectorAll('[data-action="usage-seat"]')].find((el) => el.dataset.key === key);
        const body = document.querySelector('.set-body');
        body.scrollTop = currentRow.getBoundingClientRect().top - body.getBoundingClientRect().top - 12;
      }
      document.body.dataset.previewReady = "true";
    }
    previewUsage();
  </script>
</body>
</html>
