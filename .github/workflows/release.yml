name: release

# Cut a release by pushing a tag: `git tag vX.Y.Z && git push origin vX.Y.Z`.
# This builds and attests the unsigned .app zip, then attaches it to a draft release.
# The tag's X.Y.Z MUST match acctsw/__init__.py __version__ (the job verifies and fails otherwise).
# Local signing publishes the draft; only publication triggers the Homebrew tap bump.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-release:
    if: github.event_name == 'push'
    runs-on: macos-14
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # full history → git rev-list --count gives the build number

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify tag matches __version__
        run: |
          set -euo pipefail
          CODE_VER="$(python -c 'import acctsw; print(acctsw.__version__)')"
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VER  code=$CODE_VER"
          if [ "$TAG_VER" != "$CODE_VER" ]; then
            echo "::error::tag v$TAG_VER does not match acctsw.__version__ ($CODE_VER). Bump __init__.py first."
            exit 1
          fi

      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[app,build,dev]"

      - name: Test (gate)
        run: |
          . .venv/bin/activate
          python -m pytest -q
          node --test app/web/*.test.mjs

      - name: Build web bundle + .app
        run: |
          . .venv/bin/activate
          python scripts/build-web.py
          python setup.py py2app
          python scripts/strip-bundle.py "dist/AI Guest List.app"

      - name: Reject native code hidden in bundled archives
        run: python scripts/release-bundle.py scan "dist/AI Guest List.app"

      - name: Smoke-test packaged app
        run: python scripts/smoke-bundle.py

      - name: Zip the .app
        run: |
          ditto -c -k --norsrc --keepParent "dist/AI Guest List.app" "AI-Guest-List-${GITHUB_REF_NAME}-unsigned.zip"
          shasum -a 256 "AI-Guest-List-${GITHUB_REF_NAME}-unsigned.zip"

      - name: Attest unsigned zip provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: AI-Guest-List-${{ github.ref_name }}-unsigned.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 (pinned SHA; Dependabot keeps it current)
        with:
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: AI-Guest-List-${{ github.ref_name }}-unsigned.zip
          body: |
            Draft awaiting local Developer ID signing and notarization.

  update-tap:
    # No dependency on the push-only build job: publishing is a separate event.
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read      # tap pushes use TAP_PUSH_TOKEN, not GITHUB_TOKEN
    steps:
      - name: Verify published assets
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected tag format"; exit 1; }
          ASSET="AI-Guest-List-${TAG}.zip"
          ASSET_DIR="$(mktemp -d)"
          trap 'rm -rf "$ASSET_DIR"' EXIT
          gh release download "$TAG" --repo fheinfling/ai-guest-list --pattern "$ASSET" --pattern latest.json --dir "$ASSET_DIR"
          SHA256="$(shasum -a 256 "$ASSET_DIR/$ASSET" | awk '{print $1}')"
          python3 - "$ASSET_DIR/latest.json" "$SHA256" "$TAG" <<'PYEOF'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          if manifest["sha256"] != sys.argv[2] or manifest["version"] != sys.argv[3][1:]:
              sys.exit("published zip sha256/version does not match latest.json")
          PYEOF
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fheinfling/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}

      - name: Bump cask version + sha256
        env:
          SHA256: ${{ steps.published.outputs.sha256 }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          CASK="Casks/ai-guest-list.rb"
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256 from published asset: '$SHA256'"; exit 1; }
          [[ "$VER" =~ ^[0-9A-Za-z.+-]+$ ]]  || { echo "::error::unexpected version format: '$VER'"; exit 1; }
          sed -i -E "s|^([[:space:]]*version[[:space:]]+\").*(\")$|\1${VER}\2|"    "$CASK"
          sed -i -E "s|^([[:space:]]*sha256[[:space:]]+\").*(\")$|\1${SHA256}\2|"  "$CASK"
          # Fail loudly if the sed patterns stopped matching the cask's formatting:
          grep -Fq "version \"${VER}\""    "$CASK"
          grep -Fq "sha256 \"${SHA256}\""  "$CASK"
          # This version has no in-app updater; Homebrew must keep managing upgrades.
          sed -i -E '/^[[:space:]]*auto_updates[[:space:]]/d' "$CASK"
          # Published releases are Developer ID signed and notarized: drop the legacy unsigned notice.
          python3 - "$CASK" <<'CASKEOF'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          block = re.compile(r"\n(?:[ \t]*\n)?[ \t]*caveats <<~EOS\n.*?\n[ \t]*EOS\n", re.S)
          text = block.sub(lambda m: "\n" if "not signed or notarized" in m.group(0) else m.group(0), text)
          text = re.sub(r"\n{3,}", "\n\n", text)
          open(path, "w", encoding="utf-8").write(text)
          CASKEOF
          if grep -Fq "not signed or notarized" "$CASK"; then
            echo "::error::the unsigned-build notice is still in the cask"; exit 1
          fi
          git diff -- "$CASK"

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Cask already up to date for ${TAG} — nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ai-guest-list.rb
          git commit -m "ai-guest-list ${TAG#v}"
          git push
