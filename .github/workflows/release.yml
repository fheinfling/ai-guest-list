name: release

# Cut a release by pushing a tag: `git tag vX.Y.Z && git push origin vX.Y.Z`.
# The tag's X.Y.Z MUST match acctsw/__init__.py __version__ (the build job verifies and fails otherwise).
#
#   build       no secrets. Tests, builds and scans the .app and hands the unsigned zip on as an artifact.
#   sign        runs in the `release` environment, the only place the signing secrets exist. GitHub only
#               starts it after the owner approves it, and only for v* tags (which only the owner can
#               create). It runs the tag's own release scripts and no third-party actions: inside-out
#               Developer ID signing with the hardened runtime, the designated requirement, notarization,
#               stapling and Gatekeeper's check, in a throwaway keychain. It also writes latest.json.
#   publish     no secrets. Attests provenance of the signed zip and attaches it with latest.json to a draft.
#   update-tap  runs when the owner publishes the draft and bumps the Homebrew cask.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: macos-14
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # full history → git rev-list --count gives the build number
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Verify tag matches __version__
        run: |
          set -euo pipefail
          CODE_VER="$(python -c 'import acctsw; print(acctsw.__version__)')"
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VER  code=$CODE_VER"
          if [ "$TAG_VER" != "$CODE_VER" ]; then
            echo "::error::tag v$TAG_VER does not match acctsw.__version__ ($CODE_VER). Bump __init__.py first."
            exit 1
          fi

      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[app,build,dev]"

      - name: Test (gate)
        run: |
          . .venv/bin/activate
          python -m pytest -q
          node --test app/web/*.test.mjs

      - name: Build web bundle + .app
        run: |
          . .venv/bin/activate
          python scripts/build-web.py
          python setup.py py2app
          python scripts/strip-bundle.py "dist/AI Guest List.app"

      - name: Reject native code hidden in bundled archives
        run: python scripts/release-bundle.py scan "dist/AI Guest List.app"

      - name: Smoke-test packaged app
        run: python scripts/smoke-bundle.py

      - name: Zip the .app
        id: pack
        run: |
          set -euo pipefail
          ditto -c -k --norsrc --keepParent "dist/AI Guest List.app" unsigned.zip
          echo "sha256=$(shasum -a 256 unsigned.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: unsigned.zip
          retention-days: 30   # the sign job waits for approval, at most 30 days

  sign:
    needs: build
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # only the tag's release scripts, entitlements and requirement are used

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/in

      - name: Check it is the app the build job made
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$EXPECTED  $RUNNER_TEMP/in/unsigned.zip" | shasum -a 256 -c
          python scripts/release-bundle.py check-zip "$RUNNER_TEMP/in/unsigned.zip"
          mkdir "$RUNNER_TEMP/app"
          ditto -x -k "$RUNNER_TEMP/in/unsigned.zip" "$RUNNER_TEMP/app"
          python - "$RUNNER_TEMP/app/AI Guest List.app" "$GITHUB_REF_NAME" scripts/update-manifest.py <<'PYEOF'
          from pathlib import Path
          import runpy, sys
          app = Path(sys.argv[1])
          if not app.is_dir() or list(app.parent.iterdir()) != [app]:
              sys.exit("expected exactly one top-level AI Guest List.app")
          runpy.run_path(sys.argv[3])["read_app"](app, sys.argv[2])
          PYEOF

      - name: Import the certificate into a throwaway keychain
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -base64 32)"
          echo "::add-mask::$KC_PASS"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # By SHA-1, never by an ambiguous display name.
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk '/"Developer ID Application:/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then echo "::error::no Developer ID Application identity in MACOS_CERT_P12"; exit 1; fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign inside out with the hardened runtime
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/app/AI Guest List.app"
          python scripts/release-bundle.py sign "$APP" --identity="$IDENTITY" --entitlements app/entitlements.plist
          # Any updater MUST enforce update-requirement.txt with codesign -R / SecStaticCode,
          # in addition to manifest SHA-256. No in-app updater exists on this branch.
          requirement="$(cat scripts/update-requirement.txt)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --deep --strict -R "=$requirement" "$APP"
          codesign -dvv "$APP" 2>&1 | grep -q '(runtime)' || { echo "::error::hardened runtime flag missing"; exit 1; }
          ditto -c -k --norsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"

      - name: Notarize and staple
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$NOTARY_KEY" > "$KEY"
          AUTH=(--key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${AUTH[@]}" --wait --timeout 30m --output-format json > notary.json || true
          ID="$(plutil -extract id raw notary.json 2>/dev/null || echo '?')"
          STATUS="$(plutil -extract status raw notary.json 2>/dev/null || echo 'no response')"
          echo "submission $ID: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            [ "$ID" != '?' ] && xcrun notarytool log "$ID" "${AUTH[@]}" || true
            echo "::error::notarization $STATUS"
            exit 1
          fi
          xcrun stapler staple "$RUNNER_TEMP/app/AI Guest List.app"
          xcrun stapler validate "$RUNNER_TEMP/app/AI Guest List.app"

      - name: Check the zip users will download
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/app/AI Guest List.app"
          ASSET="AI-Guest-List-${GITHUB_REF_NAME}.zip"
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 | tee spctl.txt
          if grep -q 'override=security disabled' spctl.txt; then
            echo "::warning::Gatekeeper is off on this runner; relying on the codesign and stapler checks"
          else
            grep -q 'source=Notarized Developer ID' spctl.txt
          fi
          ditto -c -k --norsrc --keepParent "$APP" "$ASSET"
          python scripts/release-bundle.py check-zip "$ASSET"
          # Verify the bytes users will extract, including the stapled ticket.
          mkdir "$RUNNER_TEMP/final-check"
          ditto -x -k "$ASSET" "$RUNNER_TEMP/final-check"
          requirement="$(cat scripts/update-requirement.txt)"
          codesign --verify --deep --strict -R "=$requirement" "$RUNNER_TEMP/final-check/AI Guest List.app"
          xcrun stapler validate "$RUNNER_TEMP/final-check/AI Guest List.app"
          python scripts/update-manifest.py --zip "$ASSET" --app "$APP" --tag "$GITHUB_REF_NAME" --out latest.json
          shasum -a 256 "$ASSET"

      - name: Delete the keychain and key files
        if: always()
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"   # set here too: the import step may have failed early
          [ -e "$KC" ] && security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: |
            AI-Guest-List-${{ github.ref_name }}.zip
            latest.json
          retention-days: 1

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the draft release
      id-token: write        # provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed

      - name: Attest provenance of the signed zip
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: AI-Guest-List-${{ github.ref_name }}.zip

      - name: Create the draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 (pinned SHA; Dependabot keeps it current)
        with:
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            AI-Guest-List-${{ github.ref_name }}.zip
            latest.json
          body: |
            Developer ID signed and notarized for macOS.

  update-tap:
    # No dependency on the push-only build job: publishing is a separate event.
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read      # tap pushes use TAP_PUSH_TOKEN, not GITHUB_TOKEN
    steps:
      - name: Verify published assets
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected tag format"; exit 1; }
          ASSET="AI-Guest-List-${TAG}.zip"
          ASSET_DIR="$(mktemp -d)"
          trap 'rm -rf "$ASSET_DIR"' EXIT
          gh release download "$TAG" --repo fheinfling/ai-guest-list --pattern "$ASSET" --pattern latest.json --dir "$ASSET_DIR"
          SHA256="$(shasum -a 256 "$ASSET_DIR/$ASSET" | awk '{print $1}')"
          python3 - "$ASSET_DIR/latest.json" "$SHA256" "$TAG" <<'PYEOF'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          if manifest["sha256"] != sys.argv[2] or manifest["version"] != sys.argv[3][1:]:
              sys.exit("published zip sha256/version does not match latest.json")
          PYEOF
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fheinfling/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}

      - name: Bump cask version + sha256
        env:
          SHA256: ${{ steps.published.outputs.sha256 }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          CASK="Casks/ai-guest-list.rb"
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256 from published asset: '$SHA256'"; exit 1; }
          [[ "$VER" =~ ^[0-9A-Za-z.+-]+$ ]]  || { echo "::error::unexpected version format: '$VER'"; exit 1; }
          sed -i -E "s|^([[:space:]]*version[[:space:]]+\").*(\")$|\1${VER}\2|"    "$CASK"
          sed -i -E "s|^([[:space:]]*sha256[[:space:]]+\").*(\")$|\1${SHA256}\2|"  "$CASK"
          # Fail loudly if the sed patterns stopped matching the cask's formatting:
          grep -Fq "version \"${VER}\""    "$CASK"
          grep -Fq "sha256 \"${SHA256}\""  "$CASK"
          # This version has no in-app updater; Homebrew must keep managing upgrades.
          sed -i -E '/^[[:space:]]*auto_updates[[:space:]]/d' "$CASK"
          # Published releases are Developer ID signed and notarized: drop the legacy unsigned notice.
          python3 - "$CASK" <<'CASKEOF'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          block = re.compile(r"\n(?:[ \t]*\n)?[ \t]*caveats <<~EOS\n.*?\n[ \t]*EOS\n", re.S)
          text = block.sub(lambda m: "\n" if "not signed or notarized" in m.group(0) else m.group(0), text)
          text = re.sub(r"\n{3,}", "\n\n", text)
          open(path, "w", encoding="utf-8").write(text)
          CASKEOF
          if grep -Fq "not signed or notarized" "$CASK"; then
            echo "::error::the unsigned-build notice is still in the cask"; exit 1
          fi
          git diff -- "$CASK"

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Cask already up to date for ${TAG} — nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ai-guest-list.rb
          git commit -m "ai-guest-list ${TAG#v}"
          git push
