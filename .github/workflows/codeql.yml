name: codeql

# Static security analysis (GitHub code scanning). Free for public repos. Python is where the
# credential/keychain/proxy logic lives, so that's what we scan. Runs on push/PR + weekly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC — catch newly-published CodeQL rules

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest        # CodeQL Python analysis is platform-agnostic; ubuntu is fast + free
    permissions:
      security-events: write       # upload results to the Security tab
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]   # actions = scan the workflow files (permissions, pinning)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
