version: 2
updates:
  # Keep the GitHub Actions we pin (checkout, setup-python, codeql, gh-release) current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # init and analyze must stay on the same version, so they're bumped in one PR.
      codeql:
        patterns: ["github/codeql-action*"]
  # App/build/dev extras in pyproject.toml (pyobjc, py2app, pytest); the engine itself is stdlib-only.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
